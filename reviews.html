<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <title>Гостинний Двір — Відгуки</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Відгуки гостей комплексу «Гостинний Двір»: ресторан традиційної кухні, готельні номери та баня на дровах у Городищі.">
  <link rel="icon" type="image/x-icon" href="favicon.png/favicons/favicon-16x16.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Montserrat:wght@400;500&display=swap"

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #f9f6f0;
      color: #3e2c1c;
    }

    /* Навігація в тон світлого стилю */
    .navbar {
      background: #2b1e17;
      border-bottom: 1px solid #e6d6c3;
    }

    .gd-hero {
      padding: 90px 20px 30px;
      text-align: center;
    }

    .gd-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      color: #4b2e1e;
      margin-bottom: 12px;
    }

    .gd-hero p {
      max-width: 720px;
      margin: 0 auto;
      color: #5a3e2b;
      font-size: 1.1rem;
    }

    .gd-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px 16px 70px;
    }

    .gd-card {
      background: #fffdf8;
      border: 1px solid #e6d6c3;
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 10px 30px rgba(75, 46, 30, 0.08);
      margin-bottom: 28px;
    }

    .gd-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: #4b2e1e;
      margin-bottom: 6px;
    }

    .gd-muted {
      color: #6b4b35;
      font-size: 0.95rem;
    }

    /* Зведена оцінка */
    .gd-summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
      gap: 28px;
      align-items: center;
    }

    @media (max-width: 768px) {
      .gd-summary {
        grid-template-columns: 1fr;
      }
    }

    .gd-average {
      font-family: 'Playfair Display', serif;
      font-size: 3.6rem;
      line-height: 1;
      color: #4b2e1e;
    }

    .gd-bar-row {
      display: grid;
      grid-template-columns: 20px 18px 1fr 34px;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #6b4b35;
    }

    .gd-bar {
      height: 9px;
      background: #f1e4d1;
      border-radius: 999px;
      overflow: hidden;
    }

    .gd-bar span {
      display: block;
      height: 100%;
      background: #a8700f;
      border-radius: 999px;
      transition: width 0.6s ease;
    }

    /* Зірки */
    .gd-stars {
      display: inline-flex;
      gap: 3px;
      line-height: 1;
    }

    .gd-stars svg {
      width: 18px;
      height: 18px;
    }

    /* Форма */
    .gd-field {
      margin-bottom: 18px;
    }

    .gd-field label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: #3e2c1c;
    }

    .gd-field input,
    .gd-field textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cdb9a3;
      border-radius: 10px;
      background: #fffdf8;
      color: #3e2c1c;
      font-family: inherit;
      font-size: 1rem;
    }

    .gd-field input:focus,
    .gd-field textarea:focus {
      outline: none;
      border-color: #4b2e1e;
      box-shadow: 0 0 0 3px rgba(75, 46, 30, 0.12);
    }

    .gd-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .gd-chip {
      border: 1px solid #cdb9a3;
      background: #fffdf8;
      color: #6b4b35;
      border-radius: 999px;
      padding: 7px 14px;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .gd-chip:hover {
      background: #f1e4d1;
    }
